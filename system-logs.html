<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sovereign System | سجلات النظام التاريخية</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&family=Rajdhani:wght@500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --sys-cyan: #00f0ff;
            --sys-purple: #9d4edd;
            --sys-red: #e11d48;
            --sys-bg-dark: #02040a;
            --sys-panel: #0b111e;
        }
        body { 
            font-family: 'Cairo', sans-serif; 
            background-color: var(--sys-bg-dark); 
            color: #ffffff;
            background-image: radial-gradient(circle at 50% 0%, rgba(0, 240, 255, 0.03) 0%, transparent 70%);
        }
        .sys-font { font-family: 'Rajdhani', sans-serif; }
        
        /* تأثيرات التوهج الاحترافية */
        .neon-glow-cyan { text-shadow: 0 0 10px rgba(0, 240, 255, 0.4); }
        .neon-glow-purple { text-shadow: 0 0 10px rgba(157, 78, 221, 0.4); }
        .border-cyan-glow { border: 1px solid rgba(0, 240, 255, 0.2); box-shadow: 0 0 15px rgba(0, 240, 255, 0.05); }
        .border-purple-glow { border: 1px solid rgba(157, 78, 221, 0.2); box-shadow: 0 0 15px rgba(157, 78, 221, 0.05); }
        .border-red-glow { border: 1px solid rgba(225, 29, 72, 0.2); box-shadow: 0 0 15px rgba(225, 29, 72, 0.05); }

        /* مخصص لشريط التمرير */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #02040a; }
        ::-webkit-scrollbar-thumb { background: #1e293b; border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--sys-cyan); }
    </style>
</head>
<body class="min-h-screen p-4 md:p-8 flex flex-col justify-between">

    <div class="max-w-5xl w-full mx-auto">
        <header class="flex flex-col sm:flex-row justify-between items-center gap-4 p-5 mb-8 bg-slate-900/40 backdrop-blur border border-slate-800 rounded-xl">
            <div class="flex items-center gap-4">
                <div class="w-12 h-12 rounded bg-gradient-to-br from-[var(--sys-cyan)] to-[var(--sys-purple)] flex items-center justify-center font-black text-black text-xl sys-font">LOG</div>
                <div>
                    <h1 class="text-xl font-black tracking-wider text-slate-100 uppercase sys-font">Sovereign System Logs</h1>
                    <p class="text-xs text-slate-400">شاشة التاريخ والتوثيق العملياتي لتحركات العاهل</p>
                </div>
            </div>
            <div class="flex gap-3">
                <button onclick="LogManager.clearLogs()" class="px-4 py-2 text-xs bg-rose-950/40 hover:bg-rose-900/60 border border-rose-800 text-rose-400 rounded transition">
                    تطهير السجلات
                </button>
                <a href="index.html" class="px-4 py-2 text-xs bg-slate-800 hover:bg-slate-700 border border-slate-700 text-slate-200 rounded transition flex items-center gap-1">
                    <span>العودة للوحة التحكم</span> ➔
                </a>
            </div>
        </header>

        <section class="flex flex-wrap gap-2 mb-6">
            <button onclick="LogManager.filter('all')" id="btn-all" class="px-4 py-2 text-xs font-bold border rounded transition bg-[var(--sys-cyan)] bg-opacity-10 text-[var(--sys-cyan)] border-[var(--sys-cyan)]">الكل</button>
            <button onclick="LogManager.filter('quest')" id="btn-quest" class="px-4 py-2 text-xs font-bold border border-slate-800 text-slate-400 rounded transition hover:text-white">المهام المنجزة</button>
            <button onclick="LogManager.filter('system')" id="btn-system" class="px-4 py-2 text-xs font-bold border border-slate-800 text-slate-400 rounded transition hover:text-white">الترقيات والألقاب</button>
            <button onclick="LogManager.filter('penalty')" id="btn-penalty" class="px-4 py-2 text-xs font-bold border border-slate-800 text-slate-400 rounded transition hover:text-white">العقوبات والتشتت</button>
        </section>

        <main id="logsContainer" class="space-y-3 min-h-[400px]">
            <div class="text-center py-20 text-slate-500 text-sm border border-dashed border-slate-800 rounded-xl">
                [لا يوجد أي سجلات مسجلة في الذاكرة حتى الآن]
            </div>
        </main>
    </div>

    <footer class="text-center text-[10px] text-slate-600 mt-12 sys-font uppercase tracking-widest">
        Sovereign Autonomy Matrix v8.0 • Secured Database
    </footer>

    <script>
        const LogManager = {
            currentFilter: 'all',

            // تحميل وعرض السجلات فور التشغيل
            init() {
                this.render();
            },

            // جلب السجلات المخزنة بأمان
            getLogs() {
                try {
                    return JSON.parse(localStorage.getItem('sovereign_system_logs')) || [];
                } catch(e) {
                    return [];
                }
            },

            // دالة إعادة البناء البصري للسجلات
            render() {
                const container = document.getElementById('logsContainer');
                const logs = this.getLogs();
                container.innerHTML = '';

                // تصفية السجلات بناءً على الفلتر المختار
                const filteredLogs = logs.filter(log => {
                    if (this.currentFilter === 'all') return true;
                    return log.type === this.currentFilter;
                });

                if (filteredLogs.length === 0) {
                    container.innerHTML = `
                        <div class="text-center py-20 text-slate-500 text-sm bg-slate-900/10 border border-dashed border-slate-800 rounded-xl">
                            [لا توجد سجلات تطابق الفرز الحالي]
                        </div>`;
                    return;
                }

                // عرض السجلات من الأحدث إلى الأقدم
                filteredLogs.reverse().forEach(log => {
                    const card = document.createElement('div');
                    let borderClass = 'border-slate-800 bg-slate-900/20';
                    let badgeColor = 'bg-slate-800 text-slate-400';
                    let typeText = 'نظام';
                    let changeColor = 'text-slate-400';

                    if (log.type === 'quest') {
                        borderClass = 'border-cyan-glow bg-cyan-950/5';
                        badgeColor = 'bg-cyan-500/10 text-[var(--sys-cyan)] border border-cyan-500/20';
                        typeText = 'مهمة منجزة';
                        changeColor = 'text-[var(--sys-cyan)] font-bold';
                    } else if (log.type === 'system') {
                        borderClass = 'border-purple-glow bg-purple-950/5';
                        badgeColor = 'bg-purple-500/10 text-[var(--sys-purple)] border border-purple-500/20';
                        typeText = 'ترقية / لقب';
                        changeColor = 'text-[var(--sys-purple)] font-bold';
                    } else if (log.type === 'penalty') {
                        borderClass = 'border-red-glow bg-rose-950/5';
                        badgeColor = 'bg-rose-500/10 text-[var(--sys-red)] border border-rose-500/20';
                        typeText = 'عقوبة تشتت';
                        changeColor = 'text-[var(--sys-red)] font-bold';
                    }

                    card.className = `p-4 border rounded-xl flex flex-col md:flex-row justify-between items-start md:items-center gap-3 transition hover:bg-slate-900/40 ${borderClass}`;
                    card.innerHTML = `
                        <div class="flex gap-3 items-start">
                            <span class="text-[10px] px-2 py-1 rounded font-bold uppercase ${badgeColor}">${typeText}</span>
                            <div>
                                <p class="text-sm text-slate-200 font-medium">${log.text}</p>
                                <span class="text-[10px] text-slate-500 sys-font">${log.timestamp}</span>
                            </div>
                        </div>
                        <div class="text-right w-full md:w-auto border-t md:border-t-0 border-slate-800/60 pt-2 md:pt-0">
                            <span class="text-xs sys-font ${changeColor}">${log.change || ''}</span>
                        </div>
                    `;
                    container.appendChild(card);
                });
            },

            // التحكم في أزرار الفرز
            filter(type) {
                this.currentFilter = type;
                const buttons = ['all', 'quest', 'system', 'penalty'];
                buttons.forEach(b => {
                    const btn = document.getElementById(`btn-${b}`);
                    if(b === type) {
                        btn.className = `px-4 py-2 text-xs font-bold border rounded transition bg-slate-800 border-slate-700 text-white`;
                        if(type === 'quest') btn.className = "px-4 py-2 text-xs font-bold border rounded transition bg-[var(--sys-cyan)] bg-opacity-10 text-[var(--sys-cyan)] border-[var(--sys-cyan)]";
                        if(type === 'system') btn.className = "px-4 py-2 text-xs font-bold border rounded transition bg-[var(--sys-purple)] bg-opacity-10 text-[var(--sys-purple)] border-[var(--sys-purple)]";
                        if(type === 'penalty') btn.className = "px-4 py-2 text-xs font-bold border rounded transition bg-[var(--sys-red)] bg-opacity-10 text-[var(--sys-red)] border-[var(--sys-red)]";
                    } else {
                        btn.className = `px-4 py-2 text-xs font-bold border border-slate-800 text-slate-400 rounded transition hover:text-white`;
                    }
                });
                this.render();
            },

            // حذف وتطهير كل السجلات
            clearLogs() {
                if (confirm("هل أنت متأكد من رغبتك في تطهير سجلات النظام الشاملة؟ لا يمكن التراجع عن هذا الإجراء.")) {
                    localStorage.removeItem('sovereign_system_logs');
                    this.render();
                }
            }
        };

        window.addEventListener('DOMContentLoaded', () => LogManager.init());
    </script>
</body>
</html>
